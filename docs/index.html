<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./assets/default.css" />
    <script src="./assets/diary.js" defer></script>
    <title>Bridget Jones Diary</title>
  </head>
  <body>
    <nav class="navbar sticky-top position-relative py-3">
      <h1 class="mx-auto mb-0">Bridget Jones Diary</h1>

      <button
        class="btn btn-outline-secondary btn-sm px-3 position-absolute top-50 end-0 translate-middle-y me-4"
        id="logout"
      >
        Log out
      </button>
    </nav>
    <main class="dairy-page my-5">
      <!-- <div class="container mb-5" id="posts"></div> -->
      <div class="diary-form">
        <h2 class="diary-title">Write a New Diary Note</h2>
        <p class="diary-subtitle">Your thoughts, your space.</p>
        <form id="post-form">
          <div class="mb-4">
            <label for="title" class="form-label">Title</label>
            <input
              type="text"
              class="form-control"
              id="title"
              name="title"
              placeholder="Give your entry a title..."
              required
            />
          </div>

          <div class="mb-4">
            <label for="category" class="form-label">Category</label>
            <select class="form-select" id="category" name="category" required>
              <option value="" selected disabled>Choose a category</option>
              <option value="Personal">Personal</option>
              <option value="Family">Family</option>
              <option value="Friends">Friends</option>
              <option value="Memories">Memories</option>
              <option value="Thoughts">Thoughts</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="form-field mb-4">
            <label for="fieldTextarea" class="form-label">Content:</label>
            <textarea
              class="form-control"
              id="fieldTextarea"
              name="content"
              rows="7"
              placeholder="Start writing..."
              required
            ></textarea>
            <div class="form-text">Take your time. This space is yours.</div>
          </div>

          <button type="submit" class="submit-button">Save</button>
        </form>
      </div>

      <div class="previous-entries">
        <h2 class="diary-title">My Previous Notes</h2>
        <div id="posts"></div>
      </div>
    </main>
    <footer class="text-center py-4 mt-5">
      <small>Bridget Jones Diary © 2026 · Your thoughts belong to you.</small>
    </footer>
  </body>
</html>
